name: CI                      # the name shown in the Actions tab

on:                           # WHEN to run
  push:
    branches: [main]          # every push to main
  pull_request:               # and every pull request

jobs:
  check:                      # one job called "check"
    runs-on: ubuntu-latest    # GitHub lends you a fresh Linux computer
    steps:
      - uses: actions/checkout@v4      # 1. download your repo onto it
      - uses: actions/setup-node@v7    # 2. install Node.js 22
        with:
          node-version: 22
          cache: npm                   #    and reuse packages between runs
      - run: npm ci                    # 3. install EXACT versions from package-lock.json
      - run: npm run lint              # 4. check code style and problems
      - run: npm run typecheck         # 5. check types
      - run: npm test                  # 6. run your 14 tests
      - run: npm run build             # 7. make sure the site builds