# Dependabot: once a week, opens a pull request when a package has an
# update. CI runs on that pull request, so you can merge it if it's green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all small updates instead of one per package
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly